{% extends "base.html" %}

{% block content %}

<h2>Submit Task</h2>

<h5>{{ task.title }}</h5>

<p>{{ task.instructions }}</p>

<form method="post" enctype="multipart/form-data">

    {{ form.hidden_tag() }}

    <div class="mb-3">
        {{ form.file.label }}
        {{ form.file(class_="form-control") }}
    </div>

    {{ form.submit(class_="btn btn-primary") }}

</form>

{% endblock %}
